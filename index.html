<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 1 Number Line Jump!</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    user-select: none;
}

body {
    background: linear-gradient(135deg, #ffdee9 0%, #b5fffc 100%);
    font-family: 'Quicksand', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    overflow-x: hidden;
}

.game-container {
    background: rgba(255,255,255,0.97);
    border-radius: 30px;
    padding: 30px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.12);
    width: 100%;
    max-width: 950px;
    text-align: center;
    border: 5px solid #ff6b81;
}

h1 {
    font-family: 'Fredoka', cursive;
    color: #ff4757;
    font-size: 2.5rem;
    margin: 0 0 8px;
    text-shadow: 2px 2px #ffccd5;
}

.subtitle {
    color: #57606f;
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0 0 28px;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 15px;
    margin-bottom: 35px;
    flex-wrap: wrap;
    background: #f1f2f6;
    padding: 18px;
    border-radius: 20px;
}

.control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

label {
    font-weight: 700;
    color: #2f3542;
    font-size: 0.95rem;
}

select,
input {
    padding: 9px 13px;
    border-radius: 12px;
    border: 2px solid #ced6e0;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    outline: none;
    background: white;
    cursor: pointer;
}

input {
    width: 95px;
    text-align: center;
}

.reset-btn {
    background: #747d8c;
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 12px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    cursor: pointer;
}

.number-line-wrapper {
    position: relative;
    margin: 100px 25px 55px;
    padding: 20px 0;
}

.line {
    height: 8px;
    background: #2f3542;
    border-radius: 5px;
    width: 100%;
    position: relative;
}

.line::before,
.line::after {
    content: '';
    position: absolute;
    top: -6px;
    border: 10px solid transparent;
}

.line::before {
    left: -15px;
    border-right-color: #2f3542;
}

.line::after {
    right: -15px;
    border-left-color: #2f3542;
}

.ticks-container {
    display: flex;
    justify-content: space-between;
    position: absolute;
    width: 100%;
    top: -6px;
}

.tick-mark {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
}

.tick-line {
    width: 3px;
    height: 20px;
    background: #2f3542;
    border-radius: 2px;
    transition: all 0.2s;
}

.tick-number {
    margin-top: 14px;
    font-weight: 700;
    font-size: 1rem;
    color: #57606f;
    transition: all 0.2s;
}

.tick-mark.active .tick-line {
    background: #ff4757;
    width: 5px;
    height: 25px;
}

.tick-mark.active .tick-number {
    color: #ff4757;
    font-size: 1.4rem;
    font-family: 'Fredoka', cursive;
}

.frog-token {
    position: absolute;
    top: -70px;
    font-size: 3rem;
    transition: left 0.5s cubic-bezier(.25,.46,.45,.94);
    transform: translateX(-50%);
    z-index: 10;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,.15));
}

/* Jump Arrow */

.jump-svg {
    position: absolute;
    left: 0;
    top: -75px;
    width: 100%;
    height: 90px;
    pointer-events: none;
    overflow: visible;
    z-index: 5;
}

.jump-path {
    fill: none;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 7 5;
    animation: showArc 0.25s ease-out forwards;
}

.arrow-head {
    animation: showArrow 0.2s ease-out forwards;
}

@keyframes showArc {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@keyframes showArrow {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

/* Buttons */

.action-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    border: none;
    color: white;
    font-family: 'Fredoka', cursive;
    font-size: 1.25rem;
    padding: 14px 28px;
    border-radius: 25px;
    cursor: pointer;
    transition: transform 0.1s;
}

.btn:active {
    transform: translateY(3px);
}

.jump-btn {
    background: #1e90ff;
    box-shadow: 0 5px 0 #1072d6;
}

.check-btn {
    background: #2ed573;
    box-shadow: 0 5px 0 #26af5f;
}

.reset-main-btn {
    background: #ff9f43;
    box-shadow: 0 5px 0 #d37e23;
}

.btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

/* Feedback */

.feedback {
    font-family: 'Fredoka', cursive;
    font-size: 1.35rem;
    color: #2f3542;
    min-height: 45px;
    margin-top: 22px;
    line-height: 1.4;
}

/* Celebration */

.celebration {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 999;
    display: none;
}

.star {
    position: absolute;
    font-size: 2.4rem;
    animation: flyUp 1.7s ease-out forwards;
}

@keyframes flyUp {

    0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
    }

}

/* Mobile */

@media(max-width:600px) {

    body {
        padding: 10px;
    }

    .game-container {
        padding: 18px 12px;
        border-width: 4px;
    }

    h1 {
        font-size: 1.8rem;
    }

    .subtitle {
        font-size: 0.9rem;
    }

    .controls {
        gap: 10px;
        padding: 12px;
    }

    .number-line-wrapper {
        margin-left: 8px;
        margin-right: 8px;
    }

    .tick-number {
        font-size: 0.75rem;
    }

    .tick-mark.active .tick-number {
        font-size: 1rem;
    }

    .frog-token {
        font-size: 2.3rem;
    }

    .btn {
        font-size: 1rem;
        padding: 11px 18px;
    }

}

</style>
</head>

<body>

<div class="game-container">

    <h1>🐸 Number Line Jump! 🐸</h1>

    <p class="subtitle">
        Set your starting point, choose the direction and jump!
    </p>

    <div class="controls">

        <div class="control-group">
            <label>1. Start From:</label>
            <select id="startNum"></select>
        </div>

        <div class="control-group">
            <label>2. Direction:</label>
            <select id="direction">
                <option value="right">➡️ Right (Add)</option>
                <option value="left">⬅️ Left (Subtract)</option>
            </select>
        </div>

        <div class="control-group">
            <label>3. Steps:</label>
            <input
                type="number"
                id="steps"
                value="3"
                min="1"
                max="10"
            >
        </div>

        <button
            class="reset-btn"
            onclick="resetGame()">
            Reset
        </button>

    </div>

    <div class="number-line-wrapper">

        <div
            id="frog"
            class="frog-token">
            🐸
        </div>

        <svg
            id="jumpSvg"
            class="jump-svg">
        </svg>

        <div class="line">

            <div
                id="ticksContainer"
                class="ticks-container">
            </div>

        </div>

    </div>

    <div class="action-buttons">

        <button
            id="jumpBtn"
            class="btn jump-btn"
            onclick="makeOneJump()">
            Let's Jump! 🐸
        </button>

        <button
            id="checkBtn"
            class="btn check-btn"
            onclick="checkAnswer()">
            Check My Answer ✅
        </button>

    </div>

    <div
        id="feedback"
        class="feedback">
    </div>

</div>

<div
    id="celebrationZone"
    class="celebration">
</div>


<script>

/* =====================================================
   GAME SETTINGS
===================================================== */

const minVal = 0;
const maxVal = 20;

let currentPos = 5;
let startPos = 5;

let totalSteps = 3;
let completedSteps = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const startSelect =
    document.getElementById("startNum");

const directionSelect =
    document.getElementById("direction");

const stepsInput =
    document.getElementById("steps");

const frog =
    document.getElementById("frog");

const ticksContainer =
    document.getElementById("ticksContainer");

const jumpSvg =
    document.getElementById("jumpSvg");

const feedback =
    document.getElementById("feedback");

const jumpBtn =
    document.getElementById("jumpBtn");

const checkBtn =
    document.getElementById("checkBtn");


/* =====================================================
   CREATE START NUMBERS 0 - 20
===================================================== */

for(let i = minVal; i <= maxVal; i++){

    const option =
        document.createElement("option");

    option.value = i;
    option.textContent = i;

    startSelect.appendChild(option);
}

startSelect.value = startPos;


/* =====================================================
   CREATE NUMBER LINE
===================================================== */

function initBoard(){

    ticksContainer.innerHTML = "";

    for(let i = minVal; i <= maxVal; i++){

        const tick =
            document.createElement("div");

        tick.className = "tick-mark";

        tick.dataset.value = i;

        tick.innerHTML =
            '<div class="tick-line"></div>' +
            '<div class="tick-number">' +
            i +
            '</div>';

        ticksContainer.appendChild(tick);
    }

    positionFrog();
}


/* =====================================================
   POSITION FROG
===================================================== */

function positionFrog(){

    const percent =
        ((currentPos - minVal) /
        (maxVal - minVal)) * 100;

    frog.style.left =
        percent + "%";

    document
        .querySelectorAll(".tick-mark")
        .forEach(tick => {

            tick.classList.toggle(
                "active",
                Number(tick.dataset.value) === currentPos
            );

        });
}


/* =====================================================
   RESET GAME
===================================================== */

function resetGame(){

    currentPos =
        Number(startSelect.value);

    startPos =
        currentPos;

    totalSteps =
        Math.max(
            1,
            Math.min(
                10,
                Number(stepsInput.value) || 1
            )
        );

    stepsInput.value =
        totalSteps;

    completedSteps = 0;

    jumpSvg.innerHTML = "";

    feedback.textContent = "";

    jumpBtn.disabled = false;

    checkBtn.disabled = false;

    positionFrog();
}


/* =====================================================
   SOUND SYSTEM
===================================================== */

/* Background music is intentionally very soft.
   It starts after the teacher/student interacts
   with the page because browsers block autoplay.
*/

let audioContext = null;
let backgroundStarted = false;
let backgroundTimer = null;


function getAudioContext(){

    if(!audioContext){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext) return null;

        audioContext =
            new AudioContext();
    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

    return audioContext;
}


/* Soft background music */

function startBackgroundMusic(){

    if(backgroundStarted) return;

    const ctx =
        getAudioContext();

    if(!ctx) return;

    backgroundStarted = true;

    const notes =
        [261.63, 329.63, 392.00, 329.63];

    let index = 0;

    function playBackgroundNote(){

        if(!backgroundStarted) return;

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.type = "sine";

        oscillator.frequency.value =
            notes[index];

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        const now =
            ctx.currentTime;

        /* VERY QUIET background */

        gain.gain.setValueAtTime(
            0.018,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.7
        );

        oscillator.start(now);

        oscillator.stop(
            now + 0.75
        );
/* =====================================================
   SOUND SYSTEM - LOUD & FUN FOR KIDS
===================================================== */

let audioContext = null;
let backgroundStarted = false;
let backgroundTimer = null;


/* Create / resume audio */

function getAudioContext(){

    if(!audioContext){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext) return null;

        audioContext = new AudioContext();
    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

    return audioContext;
}


/* =====================================================
   BACKGROUND MUSIC
   Noticeable but softer than jump/celebration
===================================================== */

function startBackgroundMusic(){

    if(backgroundStarted) return;

    const ctx = getAudioContext();

    if(!ctx) return;

    backgroundStarted = true;

    const notes = [
        261.63,
        329.63,
        392.00,
        329.63,
        293.66,
        349.23,
        440.00,
        349.23
    ];

    let index = 0;

    function playBackgroundNote(){

        if(!backgroundStarted) return;

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.type = "sine";

        oscillator.frequency.value =
            notes[index];

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        const now =
            ctx.currentTime;

        /* Background is audible but not dominant */

        gain.gain.setValueAtTime(
            0.045,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.8
        );

        oscillator.start(now);

        oscillator.stop(
            now + 0.85
        );

        index =
            (index + 1) % notes.length;

        backgroundTimer =
            setTimeout(
                playBackgroundNote,
                1000
            );
    }

    playBackgroundNote();
}


/* =====================================================
   LOUD & FUN FROG JUMP SOUND
===================================================== */

function playJumpSound(){

    const ctx =
        getAudioContext();

    if(!ctx) return;

    const now =
        ctx.currentTime;


    /* First sound - low "BOING" */

    const osc1 =
        ctx.createOscillator();

    const gain1 =
        ctx.createGain();

    osc1.type =
        "triangle";

    osc1.frequency.setValueAtTime(
        170,
        now
    );

    osc1.frequency.exponentialRampToValueAtTime(
        650,
        now + 0.22
    );

    gain1.gain.setValueAtTime(
        0.65,
        now
    );

    gain1.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.32
    );

    osc1.connect(gain1);
    gain1.connect(ctx.destination);

    osc1.start(now);

    osc1.stop(
        now + 0.34
    );


    /* Second sound - little "POP" */

    const osc2 =
        ctx.createOscillator();

    const gain2 =
        ctx.createGain();

    osc2.type =
        "sine";

    osc2.frequency.setValueAtTime(
        700,
        now + 0.08
    );

    osc2.frequency.exponentialRampToValueAtTime(
        1000,
        now + 0.18
    );

    gain2.gain.setValueAtTime(
        0.35,
        now + 0.08
    );

    gain2.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.3
    );

    osc2.connect(gain2);
    gain2.connect(ctx.destination);

    osc2.start(
        now + 0.08
    );

    osc2.stop(
        now + 0.32
    );
}


/* =====================================================
   BIG CELEBRATION SOUND
===================================================== */

function playCelebrationSound(){

    const ctx =
        getAudioContext();

    if(!ctx) return;

    const now =
        ctx.currentTime;


    /* Happy melody */

    const notes = [
        523.25,
        659.25,
        783.99,
        1046.50,
        1318.51
    ];


    notes.forEach(
        (frequency, index) => {

            const oscillator =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            oscillator.type =
                index === 4
                ? "triangle"
                : "sine";

            oscillator.frequency.value =
                frequency;

            oscillator.connect(gain);

            gain.connect(
                ctx.destination
            );

            const startTime =
                now + index * 0.13;

            gain.gain.setValueAtTime(
                0.55,
                startTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                startTime + 0.55
            );

            oscillator.start(
                startTime
            );

            oscillator.stop(
                startTime + 0.6
            );

        }
    );


    /* Extra celebration "WOW" sound */

    const wow =
        ctx.createOscillator();

    const wowGain =
        ctx.createGain();

    wow.type =
        "triangle";

    wow.frequency.setValueAtTime(
        500,
        now + 0.55
    );

    wow.frequency.exponentialRampToValueAtTime(
        1200,
        now + 0.9
    );

    wowGain.gain.setValueAtTime(
        0.45,
        now + 0.55
    );

    wowGain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 1.1
    );

    wow.connect(wowGain);

    wowGain.connect(
        ctx.destination
    );

    wow.start(
        now + 0.55
    );

    wow.stop(
        now + 1.15
    );
}


/* =====================================================
   DRAW ONE JUMP
===================================================== */

function drawJumpArrow(from, to){

    const width =
        jumpSvg.clientWidth;

    const startX =
        (from / maxVal) * width;

    const endX =
        (to / maxVal) * width;

    const direction =
        to > from ? 1 : -1;

    const middleX =
        (startX + endX) / 2;

    const baseY =
        78;

    const topY =
        22;

    const color =
        direction === 1
        ? "#1e90ff"
        : "#ff9f43";


    /* Arc */

    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );

    const d =
        `M ${startX} ${baseY}
         Q ${middleX} ${topY}
         ${endX} ${baseY}`;

    path.setAttribute(
        "d",
        d
    );

    path.setAttribute(
        "class",
        "jump-path"
    );

    path.setAttribute(
        "stroke",
        color
    );

    jumpSvg.appendChild(path);


    /* Arrow head */

    const arrowSize =
        9;

    const arrow =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polygon"
        );

    let points;


    if(direction === 1){

        points =
            `${endX},${baseY}
             ${endX-arrowSize},${baseY-arrowSize}
             ${endX-arrowSize},${baseY+arrowSize}`;

    }else{

        points =
            `${endX},${baseY}
             ${endX+arrowSize},${baseY-arrowSize}
             ${endX+arrowSize},${baseY+arrowSize}`;

    }

    arrow.setAttribute(
        "points",
        points
    );

    arrow.setAttribute(
        "fill",
        color
    );

    arrow.setAttribute(
        "class",
        "arrow-head"
    );

    jumpSvg.appendChild(arrow);
}


/* =====================================================
   ONE JUMP ONLY
===================================================== */

function makeOneJump(){

    /* Start soft background after first interaction */

    startBackgroundMusic();


    /* Read number of required steps */

    totalSteps =
        Math.max(
            1,
            Math.min(
                10,
                Number(stepsInput.value) || 1
            )
        );

    stepsInput.value =
        totalSteps;


    /* Don't allow more jumps than requested */

    if(completedSteps >= totalSteps){

        feedback.textContent =
            "🐸 You finished all " +
            totalSteps +
            " jumps! Now check your answer! ✨";

        return;
    }


    const direction =
        directionSelect.value === "right"
        ? 1
        : -1;


    const nextPos =
        currentPos + direction;


    /* Check number line limits */

    if(
        nextPos < minVal ||
        nextPos > maxVal
    ){

        feedback.textContent =
            "⚠️ The frog cannot jump outside the number line!";

        return;
    }


    /* Draw ONLY ONE arrow */

    drawJumpArrow(
        currentPos,
        nextPos
    );


    /* Jump sound */

    playJumpSound();


    /* Move ONLY ONE number */

    currentPos =
        nextPos;


    completedSteps++;


    positionFrog();


    /* Feedback */

    if(completedSteps < totalSteps){

        const remaining =
            totalSteps - completedSteps;

        feedback.textContent =
            "🐸 Great! " +
            completedSteps +
            " jump done! " +
            remaining +
            " more to go!";

    }else{

        feedback.textContent =
            "🎉 You completed " +
            totalSteps +
            " jumps! " +
            "Now check your answer! ✅";

        jumpBtn.disabled = true;
    }
}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(){

    startBackgroundMusic();


    /* Make sure all jumps are completed */

    if(completedSteps < totalSteps){

        const remaining =
            totalSteps - completedSteps;

        feedback.textContent =
            "🐸 Keep going! You still have " +
            remaining +
            " jump" +
            (remaining > 1 ? "s" : "") +
            " to make.";

        return;
    }


    /* Calculate correct answer */

    const direction =
        directionSelect.value === "right"
        ? 1
        : -1;

    const correctAnswer =
        startPos +
        direction * totalSteps;


    /* Make sure frog reached correct answer */

    if(currentPos === correctAnswer){

        playCelebrationSound();

        feedback.innerHTML =
            "🎉🎉 GREAT JOB! 🎉🎉<br>" +
            "The answer is <strong>" +
            correctAnswer +
            "</strong>! ⭐";

        celebrate();

    }else{

        feedback.textContent =
            "🤔 Let's look at the jumps again!";
    }
}


/* =====================================================
   CELEBRATION
===================================================== */

function celebrate(){

    const zone =
        document.getElementById(
            "celebrationZone"
        );

    zone.innerHTML = "";

    zone.style.display =
        "block";


    const items =
        [
            "⭐",
            "✨",
            "🌟",
            "🎈",
            "🎉",
            "🐸",
            "🏆"
        ];


    for(
        let i = 0;
        i < 30;
        i++
    ){

        const star =
            document.createElement("div");

        star.className =
            "star";

        star.textContent =
            items[
                Math.floor(
                    Math.random() *
                    items.length
                )
            ];


        star.style.left =
            Math.random() * 100 +
            "vw";


        star.style.animationDelay =
            Math.random() * 0.5 +
            "s";


        zone.appendChild(star);
    }


    setTimeout(
        () => {
            zone.style.display =
                "none";
        },
        2200
    );
}


/* =====================================================
   CONTROL CHANGES
===================================================== */

startSelect.onchange =
function(){

    resetGame();

};


directionSelect.onchange =
function(){

    if(completedSteps > 0){

        currentPos =
            startPos;

        completedSteps = 0;

        jumpSvg.innerHTML = "";

        jumpBtn.disabled = false;

        feedback.textContent =
            "🐸 Direction changed. Ready to jump!";

        positionFrog();
    }

};


stepsInput.onchange =
function(){

    if(completedSteps > 0){

        currentPos =
            startPos;

        completedSteps = 0;

        jumpSvg.innerHTML = "";

        jumpBtn.disabled = false;
    }


    let value =
        Number(stepsInput.value);

    if(value < 1)
        value = 1;

    if(value > 10)
        value = 10;

    stepsInput.value =
        value;

    totalSteps =
        value;

    feedback.textContent = "";

    positionFrog();
};


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        if(completedSteps === 0){

            jumpSvg.innerHTML = "";

        }

        positionFrog();

    }
);


/* =====================================================
   START GAME
===================================================== */

initBoard();

resetGame();

</script>
