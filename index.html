<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 1 Number Line Fun!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;user-select:none}
body{background:linear-gradient(135deg,#ffdee9 0%,#b5fffc 100%);font-family:'Quicksand',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;overflow-x:hidden}
.game-container{background:rgba(255,255,255,.95);border-radius:30px;padding:30px;box-shadow:0 15px 30px rgba(0,0,0,.1);width:100%;max-width:900px;text-align:center;border:5px solid #ff6b81;position:relative}
h1{font-family:'Fredoka',cursive;color:#ff4757;font-size:2.5rem;margin-bottom:10px;text-shadow:2px 2px #ffccd5}
p.subtitle{color:#57606f;font-size:1.2rem;font-weight:700;margin-bottom:30px}
.controls{display:flex;justify-content:center;gap:20px;margin-bottom:40px;flex-wrap:wrap;background:#f1f2f6;padding:15px;border-radius:20px}
.control-group{display:flex;flex-direction:column;align-items:center;gap:5px}
label{font-weight:700;color:#2f3542;font-size:1rem}
select,input{padding:8px 15px;border-radius:12px;border:2px solid #ced6e0;font-family:'Quicksand',sans-serif;font-weight:700;font-size:1rem;outline:none;background:white;cursor:pointer}
.number-line-wrapper{position:relative;margin:80px 20px 40px;padding:20px 0}
.line{height:8px;background:#2f3542;border-radius:4px;width:100%;position:relative}
.line:before,.line:after{content:'';position:absolute;top:-6px;border:10px solid transparent}
.line:before{left:-15px;border-right-color:#2f3542}.line:after{right:-15px;border-left-color:#2f3542}
.ticks-container{display:flex;justify-content:space-between;position:absolute;width:100%;top:-6px;padding:0 10px}
.tick-mark{display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer}
.tick-line{width:4px;height:20px;background:#2f3542;border-radius:2px;transition:all .2s}
.tick-mark.active .tick-line{background:#ff4757;height:25px;width:6px}
.tick-number{margin-top:15px;font-weight:700;font-size:1.2rem;color:#57606f;transition:color .2s}
.tick-mark.active .tick-number{color:#ff4757;font-size:1.5rem;font-family:'Fredoka',cursive}
.frog-token{position:absolute;top:-65px;font-size:3rem;transition:left .5s cubic-bezier(.25,.46,.45,.94);transform:translateX(-50%);z-index:10;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.btn-action{background:#2ed573;color:white;border:none;padding:15px 40px;font-family:'Fredoka',cursive;font-size:1.5rem;border-radius:50px;cursor:pointer;box-shadow:0 6px 0 #26af5f;transition:all .1s;margin-top:20px;letter-spacing:1px}
.btn-action:active{transform:translateY(4px);box-shadow:0 2px 0 #26af5f}
.feedback{font-family:'Fredoka',cursive;font-size:1.35rem;color:#2f3542;min-height:38px;margin-top:20px}
.celebration{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:999;display:none}
.star{position:absolute;font-size:2rem;animation:flyUp 1.5s ease-out forwards}
@keyframes flyUp{0%{transform:translateY(100vh) rotate(0);opacity:1}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}
@media(max-width:600px){h1{font-size:1.8rem}.game-container{padding:18px}.controls{gap:12px}.number-line-wrapper{margin-left:5px;margin-right:5px}.tick-number{font-size:.95rem}.tick-mark.active .tick-number{font-size:1.15rem}.frog-token{font-size:2.3rem}}
</style>
</head>
<body>
<div class="game-container">
<h1>🐸 Number Line Jump! 🐸</h1>
<p class="subtitle">Listen to your teacher, set the controls, and make the jump!</p>
<div class="controls">
<div class="control-group"><label>1. Start From:</label><select id="startNum"></select></div>
<div class="control-group"><label>2. Direction:</label><select id="direction"><option value="right">➡️ Right (Add)</option><option value="left">⬅️ Left (Subtract)</option></select></div>
<div class="control-group"><label>3. How Many Steps?</label><input type="number" id="steps" value="3" min="1" max="10"></div>
</div>
<div class="number-line-wrapper">
<div id="frog" class="frog-token">🐸</div>
<div class="line"><div class="ticks-container" id="ticksContainer"></div></div>
</div>
<button class="btn-action" id="jumpBtn">Let's Jump! ✨</button>
<div class="feedback" id="feedback"></div>
</div>
<div class="celebration" id="celebrationZone"></div>
<script>
const minVal=0,maxVal=15;let currentPos=5;
const start=document.getElementById('startNum'),dir=document.getElementById('direction'),steps=document.getElementById('steps');
const frog=document.getElementById('frog'),ticks=document.getElementById('ticksContainer'),feedback=document.getElementById('feedback');

for(let i=minVal;i<=maxVal;i++){let o=document.createElement('option');o.value=i;o.textContent=i;start.appendChild(o)}
start.value=currentPos;

function initBoard(){
 ticks.innerHTML='';
 for(let i=minVal;i<=maxVal;i++){
  const t=document.createElement('div');t.className='tick-mark';t.dataset.value=i;
  t.innerHTML='<div class="tick-line"></div><div class="tick-number">'+i+'</div>';
  t.onclick=()=>{start.value=i;resetGame()};
  ticks.appendChild(t);
 }
 positionFrog();
}
function positionFrog(){
 const percent=(currentPos-minVal)/(maxVal-minVal)*100;
 frog.style.left=percent+'%';
 document.querySelectorAll('.tick-mark').forEach(t=>t.classList.toggle('active',+t.dataset.value===currentPos));
}
function resetGame(){
 currentPos=+start.value;
 feedback.textContent='';
 positionFrog();
}
function playSound(type){
 try{
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.connect(gain);gain.connect(ctx.destination);
  osc.type=type==='jump'?'triangle':'sine';
  osc.frequency.value=type==='jump'?300:523;
  gain.gain.setValueAtTime(.18,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+(type==='jump'?.15:.5));
  osc.start();osc.stop(ctx.currentTime+(type==='jump'?.15:.5));
 }catch(e){}
}
function triggerJump(){
 const s=Math.max(1,Math.min(10,+steps.value||1));
 const d=dir.value==='right'?1:-1;
 const target=currentPos+d*s;
 if(target<minVal||target>maxVal){
  feedback.textContent='⚠️ That jump goes outside the number line!';
  return;
 }
 playSound('jump');
 currentPos=target;
 positionFrog();
 feedback.textContent='🎉 Great jump! '+(d>0?'You added ':'You subtracted ')+s+'!';
 celebrate();
}
function celebrate(){
 const zone=document.getElementById('celebrationZone');zone.innerHTML='';zone.style.display='block';
 for(let i=0;i<18;i++){let s=document.createElement('div');s.className='star';s.textContent=['⭐','✨','🌟','🎈'][Math.floor(Math.random()*4)];s.style.left=Math.random()*100+'vw';s.style.animationDelay=(Math.random()*.35)+'s';zone.appendChild(s)}
 setTimeout(()=>zone.style.display='none',1900);
 playSound('cheer');
}
document.getElementById('jumpBtn').onclick=triggerJump;
start.onchange=resetGame;dir.onchange=resetGame;steps.onchange=resetGame;
initBoard();resetGame();
</script>
</body>
</html>
