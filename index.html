<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 1 Number Line Jump!</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    user-select: none;
}

body {
    background: linear-gradient(135deg, #ffdee9 0%, #b5fffc 100%);
    font-family: 'Quicksand', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    overflow-x: hidden;
}

.game-container {
    background: rgba(255,255,255,0.96);
    border-radius: 30px;
    padding: 30px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.12);
    width: 100%;
    max-width: 950px;
    text-align: center;
    border: 5px solid #ff6b81;
}

h1 {
    font-family: 'Fredoka', cursive;
    color: #ff4757;
    font-size: 2.5rem;
    margin: 0 0 8px;
    text-shadow: 2px 2px #ffccd5;
}

.subtitle {
    color: #57606f;
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0 0 28px;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 15px;
    margin-bottom: 35px;
    flex-wrap: wrap;
    background: #f1f2f6;
    padding: 18px;
    border-radius: 20px;
}

.control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

label {
    font-weight: 700;
    color: #2f3542;
    font-size: 0.95rem;
}

select,
input {
    padding: 9px 13px;
    border-radius: 12px;
    border: 2px solid #ced6e0;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    outline: none;
    background: white;
    cursor: pointer;
}

input {
    width: 95px;
    text-align: center;
}

.reset-btn {
    background: #747d8c;
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 12px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    cursor: pointer;
}

.number-line-wrapper {
    position: relative;
    margin: 100px 25px 55px;
    padding: 20px 0;
}

.line {
    height: 8px;
    background: #2f3542;
    border-radius: 5px;
    width: 100%;
    position: relative;
}

.line::before,
.line::after {
    content: '';
    position: absolute;
    top: -6px;
    border: 10px solid transparent;
}

.line::before {
    left: -15px;
    border-right-color: #2f3542;
}

.line::after {
    right: -15px;
    border-left-color: #2f3542;
}

.ticks-container {
    display: flex;
    justify-content: space-between;
    position: absolute;
    width: 100%;
    top: -6px;
}

.tick-mark {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
}

.tick-line {
    width: 3px;
    height: 20px;
    background: #2f3542;
    border-radius: 2px;
    transition: all 0.2s;
}

.tick-number {
    margin-top: 14px;
    font-weight: 700;
    font-size: 1rem;
    color: #57606f;
    transition: all 0.2s;
}

.tick-mark.active .tick-line {
    background: #ff4757;
    width: 5px;
    height: 25px;
}

.tick-mark.active .tick-number {
    color: #ff4757;
    font-size: 1.4rem;
    font-family: 'Fredoka', cursive;
}

.frog-token {
    position: absolute;
    top: -70px;
    font-size: 3rem;
    transition: left 0.5s cubic-bezier(.25,.46,.45,.94);
    transform: translateX(-50%);
    z-index: 10;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,.15));
}

/* JUMP ARROWS */

.jump-svg {
    position: absolute;
    left: 0;
    top: -75px;
    width: 100%;
    height: 90px;
    pointer-events: none;
    overflow: visible;
    z-index: 5;
}

.jump-path {
    fill: none;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 7 5;
    opacity: 0;
    animation: showArc 0.3s ease-out forwards;
}

.arrow-head {
    opacity: 0;
    animation: showArrow 0.2s ease-out 0.1s forwards;
}

@keyframes showArc {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes showArrow {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* BUTTONS */

.action-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    border: none;
    color: white;
    font-family: 'Fredoka', cursive;
    font-size: 1.25rem;
    padding: 14px 28px;
    border-radius: 25px;
    cursor: pointer;
    transition: transform 0.1s;
}

.btn:active {
    transform: translateY(3px);
}

.jump-btn {
    background: #1e90ff;
    box-shadow: 0 5px 0 #1072d6;
}

.check-btn {
    background: #2ed573;
    box-shadow: 0 5px 0 #26af5f;
}

.reset-main-btn {
    background: #ff9f43;
    box-shadow: 0 5px 0 #d37e23;
}

.btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

/* FEEDBACK */

.feedback {
    font-family: 'Fredoka', cursive;
    font-size: 1.3rem;
    color: #2f3542;
    min-height: 38px;
    margin-top: 22px;
}

/* CELEBRATION */

.celebration {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 999;
    display: none;
}

.star {
    position: absolute;
    font-size: 2.4rem;
    animation: flyUp 1.7s ease-out forwards;
}

@keyframes flyUp {

    0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
    }

}

@media(max-width:600px) {

    body {
        padding: 10px;
    }

    .game-container {
        padding: 18px 12px;
        border-width: 4px;
    }

    h1 {
        font-size: 1.8rem;
    }

    .subtitle {
        font-size: 0.9rem;
    }

    .controls {
        gap: 10px;
        padding: 12px;
    }

    .number-line-wrapper {
        margin-left: 8px;
        margin-right: 8px;
    }

    .tick-number {
        font-size: 0.75rem;
    }

    .tick-mark.active .tick-number {
        font-size: 1rem;
    }

    .frog-token {
        font-size: 2.3rem;
    }

    .btn {
        font-size: 1rem;
        padding: 11px 18px;
    }

}

</style>
</head>

<body>

<div class="game-container">

    <h1>🐸 Number Line Jump! 🐸</h1>

    <p class="subtitle">
        Set your starting point, choose the direction and count your jumps!
    </p>

    <div class="controls">

        <div class="control-group">
            <label>1. Start From:</label>
            <select id="startNum"></select>
        </div>

        <div class="control-group">
            <label>2. Direction:</label>

            <select id="direction">

                <option value="right">
                    ➡️ Right (Add)
                </option>

                <option value="left">
                    ⬅️ Left (Subtract)
                </option>

            </select>

        </div>

        <div class="control-group">

            <label>3. Steps:</label>

            <input
                type="number"
                id="steps"
                value="3"
                min="1"
                max="10"
            >

        </div>

        <button
            class="reset-btn"
            onclick="resetGame()">

            Reset

        </button>

    </div>


    <div class="number-line-wrapper">

        <div
            id="frog"
            class="frog-token">

            🐸

        </div>


        <svg
            id="jumpSvg"
            class="jump-svg">

        </svg>


        <div class="line">

            <div
                id="ticksContainer"
                class="ticks-container">

            </div>

        </div>

    </div>


    <div class="action-buttons">

        <button
            id="jumpBtn"
            class="btn jump-btn"
            onclick="makeOneJump()">

            Let's Jump! ✨

        </button>


        <button
            class="btn check-btn"
            onclick="checkAnswer()">

            Check My Answer ✅

        </button>

    </div>


    <div
        id="feedback"
        class="feedback">

    </div>

</div>


<div
    id="celebrationZone"
    class="celebration">

</div>


<script>

/* ============================= */
/* BASIC SETTINGS */
/* ============================= */

const minVal = 0;
const maxVal = 20;

let currentPos = 5;
let startPos = 5;

let jumpsMade = 0;


/* ============================= */
/* ELEMENTS */
/* ============================= */

const startSelect =
    document.getElementById("startNum");

const directionSelect =
    document.getElementById("direction");

const stepsInput =
    document.getElementById("steps");

const frog =
    document.getElementById("frog");

const ticksContainer =
    document.getElementById("ticksContainer");

const jumpSvg =
    document.getElementById("jumpSvg");

const feedback =
    document.getElementById("feedback");

const jumpBtn =
    document.getElementById("jumpBtn");


/* ============================= */
/* CREATE START NUMBERS 0 - 20 */
/* ============================= */

for(let i = minVal; i <= maxVal; i++){

    const option =
        document.createElement("option");

    option.value = i;

    option.textContent = i;

    startSelect.appendChild(option);

}

startSelect.value = startPos;


/* ============================= */
/* CREATE NUMBER LINE */
/* ============================= */

function initBoard(){

    ticksContainer.innerHTML = "";

    for(let i = minVal; i <= maxVal; i++){

        const tick =
            document.createElement("div");

        tick.className =
            "tick-mark";

        tick.dataset.value =
            i;

        tick.innerHTML =
            '<div class="tick-line"></div>' +
            '<div class="tick-number">' +
            i +
            '</div>';

        ticksContainer.appendChild(tick);

    }

    positionFrog();

}


/* ============================= */
/* POSITION FROG */
/* ============================= */

function positionFrog(){

    const percent =
        ((currentPos - minVal) /
        (maxVal - minVal)) * 100;

    frog.style.left =
        percent + "%";


    document
        .querySelectorAll(".tick-mark")
        .forEach(tick => {

            tick.classList.toggle(
                "active",
                Number(tick.dataset.value)
                === currentPos
            );

        });

}


/* ============================= */
/* RESET GAME */
/* ============================= */

function resetGame(){

    currentPos =
        Number(startSelect.value);

    startPos =
        currentPos;

    jumpsMade = 0;

    jumpSvg.innerHTML = "";

    feedback.textContent = "";

    jumpBtn.disabled = false;

    positionFrog();

}


/* ============================= */
/* SOUND */
/* ============================= */

function playSound(type){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.connect(gain);

        gain.connect(ctx.destination);


        if(type === "jump"){

            oscillator.type =
                "triangle";

            oscillator.frequency.setValueAtTime(
                250,
                ctx.currentTime
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                450,
                ctx.currentTime + 0.15
            );

            gain.gain.setValueAtTime(
                0.16,
                ctx.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                ctx.currentTime + 0.18
            );

            oscillator.start();

            oscillator.stop(
                ctx.currentTime + 0.18
            );

        }

        else{

            oscillator.type =
                "sine";

            oscillator.frequency.setValueAtTime(
                523,
                ctx.currentTime
            );

            gain.gain.setValueAtTime(
                0.12,
                ctx.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                ctx.currentTime + 0.6
            );

            oscillator.start();

            oscillator.stop(
                ctx.currentTime + 0.6
            );

        }

    }

    catch(e){

        /* Sound is optional */

    }

}


/* ============================= */
/* DRAW ONE ARROW */
/* ============================= */

function drawJumpArrow(from, to){

    const width =
        jumpSvg.clientWidth;

    const startX =
        (from / maxVal) * width;

    const endX =
        (to / maxVal) * width;

    const direction =
        to > from ? 1 : -1;

    const middleX =
        (startX + endX) / 2;

    const baseY =
        78;

    const topY =
        25;

    const color =
        direction === 1
        ? "#1e90ff"
        : "#ff9f43";


    /* ARC */

    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );

    const d =
        `M ${startX} ${baseY}
         Q ${middleX} ${topY}
         ${endX} ${baseY}`;

    path.setAttribute(
        "d",
        d
    );

    path.setAttribute(
        "class",
        "jump-path"
    );

    path.setAttribute(
        "stroke",
        color
    );

    jumpSvg.appendChild(path);


    /* ARROW HEAD */

    const arrowSize =
        8;

    const arrow =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polygon"
        );

    let points;


    if(direction === 1){

        points =
            `${endX},${baseY}
             ${endX-arrowSize},${baseY-arrowSize}
             ${endX-arrowSize},${baseY+arrowSize}`;

    }

    else{

        points =
            `${endX},${baseY}
             ${endX+arrowSize},${baseY-arrowSize}
             ${endX+arrowSize},${baseY+arrowSize}`;

    }


    arrow.setAttribute(
        "points",
        points
    );

    arrow.setAttribute(
        "fill",
        color
    );

    arrow.setAttribute(
        "class",
        "arrow-head"
    );

    jumpSvg.appendChild(arrow);

}


/* ============================= */
/* MAKE ONE JUMP ONLY */
/* ============================= */

function makeOneJump(){

    const requiredSteps =
        Number(stepsInput.value);


    const safeSteps =
        Math.max(
            1,
            Math.min(
                10,
                requiredSteps || 1
            )
        );


    stepsInput.value =
        safeSteps;


    /* Already finished */

    if(jumpsMade >= safeSteps){

        feedback.textContent =
            "🎉 We already made " +
            safeSteps +
            " jumps!";

        return;

    }


    const direction =
        directionSelect.value === "right"
        ? 1
        : -1;


    const nextPos =
        currentPos + direction;


    /* Check number line boundary */

    if(
        nextPos < minVal ||
        nextPos > maxVal
    ){

        feedback.textContent =
            "⚠️ We cannot jump outside the number line!";

        return;

    }


    /* One jump */

    drawJumpArrow(
        currentPos,
        nextPos
    );


    playSound("jump");


    currentPos =
        nextPos;


    jumpsMade++;


    positionFrog();


    /* Feedback */

    if(jumpsMade < safeSteps){

        feedback.textContent =
            "🐸 Jump " +
            jumpsMade +
            " of " +
            safeSteps +
            "! Keep counting!";

    }

    else{

        feedback.textContent =
            "🎉 We made " +
            safeSteps +
            " jumps! " +
            "Where did we land?";

    }

}


/* ============================= */
/* CHECK ANSWER */
/* ============================= */

function checkAnswer(){

    const requiredSteps =
        Number(stepsInput.value);


    const safeSteps =
        Math.max(
            1,
            Math.min(
                10,
                requiredSteps || 1
            )
        );


    if(jumpsMade < safeSteps){

        feedback.textContent =
            "🐸 We need " +
            (safeSteps - jumpsMade) +
            " more jump" +
            ((safeSteps - jumpsMade) === 1 ? "" : "s") +
            "!";

        return;

    }


    playSound("cheer");


    feedback.textContent =
        "🎉 Great job! The answer is " +
        currentPos +
        "!";


    celebrate();

}


/* ============================= */
/* CELEBRATION */
/* ============================= */

function celebrate(){

    const zone =
        document.getElementById(
            "celebrationZone"
        );

    zone.innerHTML =
        "";

    zone.style.display =
        "block";


    const items = [
        "⭐",
        "✨",
        "🌟",
        "🎈",
        "🎉",
        "🐸"
    ];


    for(
        let i = 0;
        i < 25;
        i++
    ){

        const star =
            document.createElement("div");

        star.className =
            "star";

        star.textContent =
            items[
                Math.floor(
                    Math.random() *
                    items.length
                )
            ];


        star.style.left =
            Math.random() * 100 +
            "vw";


        star.style.animationDelay =
            Math.random() * 0.4 +
            "s";


        zone.appendChild(star);

    }


    setTimeout(
        () => {

            zone.style.display =
                "none";

        },
        2000
    );

}


/* ============================= */
/* WHEN START CHANGES */
/* ============================= */

startSelect.onchange =
function(){

    resetGame();

};


/* ============================= */
/* WHEN DIRECTION CHANGES */
/* ============================= */

directionSelect.onchange =
function(){

    resetGame();

};


/* ============================= */
/* WHEN STEPS CHANGES */
/* ============================= */

stepsInput.onchange =
function(){

    let value =
        Number(stepsInput.value);


    if(value < 1)
        value = 1;


    if(value > 10)
        value = 10;


    stepsInput.value =
        value;


    resetGame();

};


/* ============================= */
/* RESIZE */
/* ============================= */

window.addEventListener(
    "resize",
    () => {

        if(jumpSvg){

            jumpSvg.innerHTML =
                "";

            positionFrog();

        }

    }
);


/* ============================= */
/* START */
/* ============================= */

initBoard();

resetGame();

</script>

</body>
    </html>
