<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 1 Number Line Jump!</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    user-select:none;
}

body{
    background:linear-gradient(135deg,#ffdee9 0%,#b5fffc 100%);
    font-family:'Quicksand',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    margin:0;
    padding:20px;
    overflow-x:hidden;
}

.game-container{
    background:rgba(255,255,255,.97);
    border-radius:30px;
    padding:30px;
    box-shadow:0 15px 30px rgba(0,0,0,.15);
    width:100%;
    max-width:950px;
    text-align:center;
    border:5px solid #ff6b81;
}

h1{
    font-family:'Fredoka',cursive;
    color:#ff4757;
    font-size:2.5rem;
    margin:0 0 8px;
    text-shadow:2px 2px #ffccd5;
}

.subtitle{
    color:#57606f;
    font-size:1.15rem;
    font-weight:700;
    margin:0 0 28px;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:15px;
    margin-bottom:35px;
    flex-wrap:wrap;
    background:#f1f2f6;
    padding:18px;
    border-radius:20px;
}

.control-group{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
}

label{
    font-weight:700;
    color:#2f3542;
    font-size:.95rem;
}

select,
input{
    padding:9px 13px;
    border-radius:12px;
    border:2px solid #ced6e0;
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:1rem;
    outline:none;
    background:white;
    cursor:pointer;
}

input{
    width:95px;
    text-align:center;
}

.sound-control{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.sound-btn{
    background:#5352ed;
    color:white;
    border:none;
    padding:9px 14px;
    border-radius:12px;
    font-size:1.1rem;
    cursor:pointer;
}

.volume{
    width:90px;
    cursor:pointer;
}

.reset-btn{
    background:#747d8c;
    color:white;
    border:none;
    padding:9px 18px;
    border-radius:12px;
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    cursor:pointer;
}

.number-line-wrapper{
    position:relative;
    margin:105px 25px 55px;
    padding:20px 0;
}

.line{
    height:8px;
    background:#2f3542;
    border-radius:5px;
    width:100%;
    position:relative;
}

.line::before,
.line::after{
    content:'';
    position:absolute;
    top:-6px;
    border:10px solid transparent;
}

.line::before{
    left:-15px;
    border-right-color:#2f3542;
}

.line::after{
    right:-15px;
    border-left-color:#2f3542;
}

.ticks-container{
    display:flex;
    justify-content:space-between;
    position:absolute;
    width:100%;
    top:-6px;
}

.tick-mark{
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
}

.tick-line{
    width:3px;
    height:20px;
    background:#2f3542;
    border-radius:2px;
    transition:all .2s;
}

.tick-number{
    margin-top:14px;
    font-weight:700;
    font-size:1rem;
    color:#57606f;
    transition:all .2s;
}

.tick-mark.active .tick-line{
    background:#ff4757;
    width:5px;
    height:27px;
}

.tick-mark.active .tick-number{
    color:#ff4757;
    font-size:1.4rem;
    font-family:'Fredoka',cursive;
}

.frog-token{
    position:absolute;
    top:-72px;
    font-size:3rem;
    transition:left .55s cubic-bezier(.25,.46,.45,.94);
    transform:translateX(-50%);
    z-index:10;
    filter:drop-shadow(0 4px 5px rgba(0,0,0,.15));
}

.jump-svg{
    position:absolute;
    left:0;
    top:-78px;
    width:100%;
    height:95px;
    pointer-events:none;
    overflow:visible;
    z-index:5;
}

.jump-path{
    fill:none;
    stroke-width:4;
    stroke-linecap:round;
    stroke-dasharray:8 5;
    opacity:0;
    animation:showArc .25s ease-out forwards;
}

.arrow-head{
    opacity:0;
    animation:showArrow .2s ease-out .08s forwards;
}

@keyframes showArc{
    from{opacity:0}
    to{opacity:1}
}

@keyframes showArrow{
    from{opacity:0}
    to{opacity:1}
}

.action-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    color:white;
    font-family:'Fredoka',cursive;
    font-size:1.25rem;
    padding:14px 28px;
    border-radius:25px;
    cursor:pointer;
    transition:transform .1s;
}

.btn:active{
    transform:translateY(4px);
}

.jump-btn{
    background:#1e90ff;
    box-shadow:0 6px 0 #1072d6;
}

.check-btn{
    background:#2ed573;
    box-shadow:0 6px 0 #26af5f;
}

.reset-main-btn{
    background:#ff9f43;
    box-shadow:0 6px 0 #d37e23;
}

.btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.feedback{
    font-family:'Fredoka',cursive;
    font-size:1.35rem;
    color:#2f3542;
    min-height:42px;
    margin-top:22px;
}

.celebration{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    pointer-events:none;
    z-index:999;
    display:none;
}

.star{
    position:absolute;
    font-size:2.5rem;
    animation:flyUp 1.7s ease-out forwards;
}

@keyframes flyUp{

    0%{
        transform:translateY(100vh) rotate(0deg) scale(.7);
        opacity:1;
    }

    60%{
        opacity:1;
    }

    100%{
        transform:translateY(-10vh) rotate(720deg) scale(1.2);
        opacity:0;
    }
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .game-container{
        padding:18px 12px;
        border-width:4px;
    }

    h1{
        font-size:1.8rem;
    }

    .subtitle{
        font-size:.9rem;
    }

    .controls{
        gap:10px;
        padding:12px;
    }

    .number-line-wrapper{
        margin-left:5px;
        margin-right:5px;
    }

    .tick-number{
        font-size:.72rem;
    }

    .tick-mark.active .tick-number{
        font-size:1rem;
    }

    .frog-token{
        font-size:2.3rem;
    }

    .btn{
        font-size:1rem;
        padding:11px 18px;
    }

}

</style>
</head>

<body>

<div class="game-container">

    <h1>🐸 Number Line Jump! 🐸</h1>

    <p class="subtitle">
        Start at a number, choose your direction, then jump one step at a time!
    </p>

    <div class="controls">

        <div class="control-group">
            <label>1. Start From:</label>
            <select id="startNum"></select>
        </div>

        <div class="control-group">
            <label>2. Direction:</label>
            <select id="direction">
                <option value="right">➡️ Right (Add)</option>
                <option value="left">⬅️ Left (Subtract)</option>
            </select>
        </div>

        <div class="control-group">
            <label>3. Steps:</label>
            <input
                type="number"
                id="steps"
                value="3"
                min="1"
                max="10"
            >
        </div>

        <button
            class="reset-btn"
            onclick="resetGame()">
            Reset
        </button>

        <div class="sound-control">

            <button
                id="soundBtn"
                class="sound-btn"
                onclick="toggleSound()">
                🔊
            </button>

            <input
                id="volumeControl"
                class="volume"
                type="range"
                min="0"
                max="1"
                step="0.05"
                value="1"
            >

        </div>

    </div>


    <div class="number-line-wrapper">

        <div
            id="frog"
            class="frog-token">
            🐸
        </div>

        <svg
            id="jumpSvg"
            class="jump-svg">
        </svg>

        <div class="line">

            <div
                id="ticksContainer"
                class="ticks-container">
            </div>

        </div>

    </div>


    <div class="action-buttons">

        <button
            id="jumpBtn"
            class="btn jump-btn"
            onclick="startJump()">
            🐸 Let's Jump! ✨
        </button>

        <button
            id="checkBtn"
            class="btn check-btn"
            onclick="checkAnswer()">
            Check My Answer ✅
        </button>

    </div>


    <div
        id="feedback"
        class="feedback">
    </div>

</div>


<div
    id="celebrationZone"
    class="celebration">
</div>


<script>

/* =========================================================
   GAME SETTINGS
========================================================= */

const minVal = 0;
const maxVal = 20;

let currentPos = 5;
let startPos = 5;

let isJumping = false;

let audioCtx = null;
let masterGain = null;
let musicGain = null;

let musicStarted = false;
let soundEnabled = true;

let musicTimer = null;
let musicStep = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const startSelect =
    document.getElementById("startNum");

const directionSelect =
    document.getElementById("direction");

const stepsInput =
    document.getElementById("steps");

const frog =
    document.getElementById("frog");

const ticksContainer =
    document.getElementById("ticksContainer");

const jumpSvg =
    document.getElementById("jumpSvg");

const feedback =
    document.getElementById("feedback");

const jumpBtn =
    document.getElementById("jumpBtn");

const checkBtn =
    document.getElementById("checkBtn");

const soundBtn =
    document.getElementById("soundBtn");

const volumeControl =
    document.getElementById("volumeControl");


/* =========================================================
   CREATE START NUMBERS 0 - 20
========================================================= */

for(let i=minVal;i<=maxVal;i++){

    const option =
        document.createElement("option");

    option.value = i;
    option.textContent = i;

    startSelect.appendChild(option);
}

startSelect.value = startPos;


/* =========================================================
   AUDIO SETUP
========================================================= */

function setupAudio(){

    if(audioCtx) return;

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        audioCtx =
            new AudioContext();

        masterGain =
            audioCtx.createGain();

        musicGain =
            audioCtx.createGain();

        masterGain.gain.value = 1;
        musicGain.gain.value = 0.28;

        musicGain.connect(masterGain);
        masterGain.connect(audioCtx.destination);

    }catch(e){

        audioCtx = null;

    }

}


/* =========================================================
   START BACKGROUND MUSIC
========================================================= */

function startBackgroundMusic(){

    if(!soundEnabled) return;

    setupAudio();

    if(!audioCtx || musicStarted) return;

    try{

        if(audioCtx.state === "suspended"){
            audioCtx.resume();
        }

        musicStarted = true;

        musicStep = 0;

        playBackgroundNote();

        musicTimer =
            setInterval(
                playBackgroundNote,
                430
            );

    }catch(e){}

}


/* =========================================================
   BACKGROUND MUSIC NOTES
   Cheerful children's style
========================================================= */

function playBackgroundNote(){

    if(!audioCtx || !soundEnabled) return;

    const melody = [
        523.25,
        659.25,
        783.99,
        659.25,
        587.33,
        698.46,
        880.00,
        698.46,
        523.25,
        659.25,
        783.99,
        1046.50
    ];

    const bass = [
        261.63,
        261.63,
        329.63,
        293.66
    ];

    const note =
        melody[musicStep % melody.length];

    const bassNote =
        bass[musicStep % bass.length];

    const now =
        audioCtx.currentTime;


    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type = "triangle";

    osc.frequency.setValueAtTime(
        note,
        now
    );

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        0.09,
        now + 0.025
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.34
    );

    osc.connect(gain);
    gain.connect(musicGain);

    osc.start(now);
    osc.stop(now + 0.36);


    const bassOsc =
        audioCtx.createOscillator();

    const bassGain =
        audioCtx.createGain();

    bassOsc.type = "sine";

    bassOsc.frequency.setValueAtTime(
        bassNote,
        now
    );

    bassGain.gain.setValueAtTime(
        0.0001,
        now
    );

    bassGain.gain.exponentialRampToValueAtTime(
        0.045,
        now + 0.03
    );

    bassGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.35
    );

    bassOsc.connect(bassGain);
    bassGain.connect(musicGain);

    bassOsc.start(now);
    bassOsc.stop(now + 0.36);

    musicStep++;

}


/* =========================================================
   MASTER VOLUME
========================================================= */

volumeControl.oninput = function(){

    if(!masterGain) setupAudio();

    if(masterGain){

        masterGain.gain.value =
            Number(volumeControl.value);

    }

};


/* =========================================================
   SOUND ON / OFF
========================================================= */

function toggleSound(){

    setupAudio();

    soundEnabled =
        !soundEnabled;

    if(soundEnabled){

        soundBtn.textContent = "🔊";

        if(masterGain){

            masterGain.gain.value =
                Number(volumeControl.value);

        }

        startBackgroundMusic();

    }else{

        soundBtn.textContent = "🔇";

        if(masterGain){
            masterGain.gain.value = 0;
        }

    }

}


/* =========================================================
   MAKE SOUND
========================================================= */

function playTone(
    frequency,
    duration,
    type="sine",
    volume=0.5
){

    if(!soundEnabled) return;

    setupAudio();

    if(!audioCtx || !masterGain) return;

    try{

        if(audioCtx.state === "suspended"){
            audioCtx.resume();
        }

        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        osc.type = type;

        osc.frequency.setValueAtTime(
            frequency,
            audioCtx.currentTime
        );

        gain.gain.setValueAtTime(
            0.0001,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            volume,
            audioCtx.currentTime + 0.015
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioCtx.currentTime + duration
        );

        osc.connect(gain);
        gain.connect(masterGain);

        osc.start();

        osc.stop(
            audioCtx.currentTime +
            duration
        );

    }catch(e){}

}


/* =========================================================
   JUMP SOUND
========================================================= */

function jumpSound(){

    if(!soundEnabled) return;

    setupAudio();

    if(!audioCtx) return;

    try{

        const now =
            audioCtx.currentTime;


        /* Main jump sound */

        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        osc.type = "triangle";

        osc.frequency.setValueAtTime(
            220,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            620,
            now + 0.16
        );

        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.65,
            now + 0.025
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.24
        );

        osc.connect(gain);
        gain.connect(masterGain);

        osc.start(now);
        osc.stop(now + 0.25);


        /* Small high note */

        playTone(
            880,
            0.12,
            "sine",
            0.30
        );

    }catch(e){}

}


/* =========================================================
   CELEBRATION SOUND
========================================================= */

function celebrationSound(){

    if(!soundEnabled) return;

    setupAudio();

    if(!audioCtx) return;

    try{

        const notes = [
            523.25,
            659.25,
            783.99,
            1046.50,
            1318.51,
            1567.98
        ];

        notes.forEach(
            (frequency,index)=>{

                setTimeout(
                    ()=>{

                        playTone(
                            frequency,
                            0.45,
                            "sine",
                            0.75
                        );

                    },
                    index * 100
                );

            }
        );


        /* Extra sparkle sounds */

        for(let i=0;i<8;i++){

            setTimeout(
                ()=>{

                    const randomNotes = [
                        1046.50,
                        1174.66,
                        1318.51,
                        1567.98,
                        1760
                    ];

                    playTone(
                        randomNotes[
                            Math.floor(
                                Math.random() *
                                randomNotes.length
                            )
                        ],
                        0.25,
                        "triangle",
                        0.45
                    );

                },
                250 + i * 90
            );

        }

    }catch(e){}

}


/* =========================================================
   NUMBER LINE
========================================================= */

function initBoard(){

    ticksContainer.innerHTML = "";

    for(
        let i=minVal;
        i<=maxVal;
        i++
    ){

        const tick =
            document.createElement("div");

        tick.className =
            "tick-mark";

        tick.dataset.value =
            i;

        tick.innerHTML =
            '<div class="tick-line"></div>' +
            '<div class="tick-number">' +
            i +
            '</div>';

        ticksContainer.appendChild(tick);

    }

    positionFrog();

}


/* =========================================================
   POSITION FROG
========================================================= */

function positionFrog(){

    const percent =
        ((currentPos-minVal) /
        (maxVal-minVal)) * 100;

    frog.style.left =
        percent + "%";


    document
        .querySelectorAll(".tick-mark")
        .forEach(
            tick=>{

                tick.classList.toggle(
                    "active",
                    Number(tick.dataset.value)
                    === currentPos
                );

            }
        );

}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame(){

    if(isJumping) return;

    startBackgroundMusic();

    currentPos =
        Number(startSelect.value);

    startPos =
        currentPos;

    jumpSvg.innerHTML = "";

    feedback.textContent = "";

    positionFrog();

}


/* =========================================================
   DRAW ONE ARROW
========================================================= */

function drawJumpArrow(from,to){

    const width =
        jumpSvg.clientWidth;

    const startX =
        (from/maxVal) * width;

    const endX =
        (to/maxVal) * width;

    const direction =
        to > from ? 1 : -1;

    const middleX =
        (startX+endX)/2;

    const baseY = 78;
    const topY = 20;

    const color =
        direction === 1
        ? "#1e90ff"
        : "#ff9f43";


    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );

    const d =
        `M ${startX} ${baseY}
         Q ${middleX} ${topY}
         ${endX} ${baseY}`;


    path.setAttribute(
        "d",
        d
    );

    path.setAttribute(
        "class",
        "jump-path"
    );

    path.setAttribute(
        "stroke",
        color
    );

    jumpSvg.appendChild(path);


    /* Arrow head */

    const arrowSize = 9;

    const arrow =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polygon"
        );


    let points;


    if(direction === 1){

        points =
            `${endX},${baseY}
             ${endX-arrowSize},${baseY-arrowSize}
             ${endX-arrowSize},${baseY+arrowSize}`;

    }else{

        points =
            `${endX},${baseY}
             ${endX+arrowSize},${baseY-arrowSize}
             ${endX+arrowSize},${baseY+arrowSize}`;

    }


    arrow.setAttribute(
        "points",
        points
    );

    arrow.setAttribute(
        "fill",
        color
    );

    arrow.setAttribute(
        "class",
        "arrow-head"
    );

    jumpSvg.appendChild(arrow);

}


/* =========================================================
   ONE JUMP ONLY
========================================================= */

async function startJump(){

    if(isJumping) return;

    /* First user interaction starts music */

    startBackgroundMusic();

    let steps =
        Number(stepsInput.value);

    steps =
        Math.max(
            1,
            Math.min(
                10,
                steps || 1
            )
        );

    stepsInput.value =
        steps;


    const direction =
        directionSelect.value === "right"
        ? 1
        : -1;


    /*
       IMPORTANT:
       Steps does NOT make the frog
       jump several times.

       Each button press = ONE jump.
    */


    const target =
        currentPos + direction;


    if(
        target < minVal ||
        target > maxVal
    ){

        feedback.textContent =
            "⚠️ The frog cannot jump outside the number line!";

        return;

    }


    /* Check how many jumps have been completed */

    const completedJumps =
        Math.abs(
            currentPos-startPos
        );


    if(completedJumps >= steps){

        feedback.textContent =
            "🐸 You already made all the jumps! Now check your answer!";

        return;

    }


    isJumping = true;

    jumpBtn.disabled = true;

    checkBtn.disabled = true;


    jumpSvg.innerHTML = "";


    drawJumpArrow(
        currentPos,
        target
    );


    jumpSound();


    currentPos =
        target;


    positionFrog();


    const newCount =
        Math.abs(
            currentPos-startPos
        );


    if(newCount < steps){

        feedback.textContent =
            "🐸 Great! " +
            newCount +
            " jump" +
            (newCount===1?"":"s") +
            " done. Jump again!";

    }else{

        feedback.textContent =
            "🎯 You finished " +
            steps +
            " jumps! What is your answer?";

    }


    await new Promise(
        resolve =>
        setTimeout(
            resolve,
            550
        )
    );


    isJumping = false;

    jumpBtn.disabled = false;

    checkBtn.disabled = false;

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(){

    if(isJumping){

        feedback.textContent =
            "🐸 Wait for the jump to finish!";

        return;

    }


    startBackgroundMusic();


    const steps =
        Number(stepsInput.value);

    const completedJumps =
        Math.abs(
            currentPos-startPos
        );


    if(completedJumps !== steps){

        feedback.textContent =
            "🤔 Not yet! We need " +
            steps +
            " jumps. Keep going!";

        jumpSound();

        return;

    }


    celebrationSound();


    feedback.textContent =
        "🎉 AMAZING! The answer is " +
        currentPos +
        "! 🎉";


    celebrate();

}


/* =========================================================
   CELEBRATION
========================================================= */

function celebrate(){

    const zone =
        document.getElementById(
            "celebrationZone"
        );

    zone.innerHTML = "";

    zone.style.display =
        "block";


    const items = [
        "⭐",
        "✨",
        "🌟",
        "🎈",
        "🎉",
        "🥳",
        "🐸",
        "🏆"
    ];


    for(
        let i=0;
        i<35;
        i++
    ){

        const star =
            document.createElement("div");

        star.className =
            "star";

        star.textContent =
            items[
                Math.floor(
                    Math.random() *
                    items.length
                )
            ];


        star.style.left =
            Math.random()*100 +
            "vw";


        star.style.animationDelay =
            Math.random()*0.6 +
            "s";


        zone.appendChild(star);

    }


    setTimeout(
        ()=>{
            zone.style.display =
                "none";
        },
        2300
    );

}


/* =========================================================
   CONTROL CHANGES
========================================================= */

startSelect.onchange =
function(){

    if(isJumping) return;

    resetGame();

};


directionSelect.onchange =
function(){

    if(isJumping) return;

    feedback.textContent =
        "";

    /*
       Changing direction prepares
       the next jump.
    */

};


stepsInput.onchange =
function(){

    if(isJumping) return;

    let value =
        Number(
            stepsInput.value
        );

    if(value<1)
        value=1;

    if(value>10)
        value=10;

    stepsInput.value =
        value;

};


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{
        if(!isJumping){

            /*
               Keep frog position.
               Remove old arrow because
               screen dimensions changed.
            */

            jumpSvg.innerHTML = "";

            positionFrog();

        }
    }
);


/* =========================================================
   TRY AUTOPLAY MUSIC
========================================================= */

window.addEventListener(
    "load",
    ()=>{

        /*
           Some browsers allow this,
           others block autoplay.
        */

        setTimeout(
            ()=>{
                startBackgroundMusic();
            },
            300
        );

    }
);


/* =========================================================
   FIRST USER INTERACTION
========================================================= */

document.addEventListener(
    "pointerdown",
    ()=>{
        startBackgroundMusic();
    },
    {once:true}
);


/* =========================================================
   START GAME
========================================================= */

initBoard();

resetGame();

</script>
